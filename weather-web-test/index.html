<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>天气获取测试</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f2f5f9;margin:0;padding:20px;color:#222}
.card{background:#fff;padding:20px;border-radius:18px;margin-bottom:16px}
button{width:100%;padding:15px;border:0;border-radius:12px;background:#1677ff;color:white;font-size:18px}
.weather{font-size:18px;line-height:1.8}
pre{white-space:pre-wrap;word-break:break-all;background:#111;color:#eee;padding:15px;border-radius:12px;font-size:13px}
.small{color:#666;font-size:14px}
</style>
</head>
<body>
<div class="card">
<h2>天气接口测试</h2>
<div class="small">手机打开页面后，点击按钮获取位置并测试天气接口。</div>
<br>
<button id="location">获取位置并更新天气</button>
</div>
<div class="card weather" id="weather">等待操作</div>
<div class="card">
<h3>接口返回</h3>
<pre id="raw">等待接口返回...</pre>
</div>
<script>
const weather=document.getElementById('weather');
const raw=document.getElementById('raw');

document.getElementById('location').onclick=()=>{
 navigator.geolocation.getCurrentPosition(async p=>{
  const lat=p.coords.latitude.toFixed(5);
  const lon=p.coords.longitude.toFixed(5);
  weather.textContent='位置 '+lat+','+lon+' 正在请求...';
  try{
   const r=await fetch('https://api.weathercn.com');
   const t=await r.text();
   weather.textContent='HTTP '+r.status;
   raw.textContent=t.slice(0,5000);
  }catch(e){raw.textContent='请求失败: '+e.message;}
 },e=>weather.textContent='定位失败: '+e.message);
};
</script>
</body>
</html>
