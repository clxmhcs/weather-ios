<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Weather API Test</title>
<style>
body{margin:0;padding:18px;background:#eef3f8;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#222}.card{background:#fff;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 5px 20px #0001}button{width:100%;height:52px;border:0;border-radius:14px;background:#1677ff;color:#fff;font-size:18px}pre{background:#111;color:#eee;padding:15px;border-radius:14px;white-space:pre-wrap;word-break:break-all;font-size:13px}.info{line-height:1.8}
</style>
</head>
<body>
<div class="card"><h2>天气获取测试</h2><p>获取手机位置 → 请求天气接口 → 显示返回。</p><button id="btn">获取位置并更新天气</button></div>
<div class="card info" id="info">等待操作</div>
<div class="card"><h3>接口响应</h3><pre id="result">等待数据...</pre></div>
<script>
const info=document.getElementById('info');
const result=document.getElementById('result');
function showLocation(p){
 const lat=p.coords.latitude,lon=p.coords.longitude;
 info.innerHTML='位置：<br>'+lat+'<br>'+lon+'<br>正在请求天气接口...';
 requestWeather(lat,lon);
}
async function requestWeather(lat,lon){
 try{
  // GitHub Pages 浏览器禁止直接跨域访问 weathercn，此处保留接口探针。
  const url='https://api.weathercn.com';
  const r=await fetch(url);
  const t=await r.text();
  info.innerHTML+=' <br>HTTP状态：'+r.status;
  result.textContent=t||'(空响应)';
 }catch(e){
  info.innerHTML+=' <br>浏览器跨域拦截';
  result.textContent='下一步使用 weather-proxy 进行服务器转发测试。\n\n'+e;
 }
}
document.getElementById('btn').onclick=()=>{
 info.textContent='正在获取GPS位置...';
 navigator.geolocation.getCurrentPosition(showLocation,e=>info.textContent='定位失败：'+e.message,{enableHighAccuracy:true,timeout:10000});
};
</script>
</body>
</html>
