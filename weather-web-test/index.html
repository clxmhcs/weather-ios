<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather Location Test</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:20px;background:#f3f6fb;color:#222}
.card{background:#fff;padding:20px;border-radius:16px;margin-bottom:16px}
button{padding:12px 18px;border:0;border-radius:10px;font-size:16px}
.weather{font-size:20px;margin-top:15px}
pre{white-space:pre-wrap;background:#111;color:#eee;padding:15px;border-radius:12px}
</style>
</head>
<body>
<div class="card">
<h2>天气获取测试</h2>
<p>测试流程：</p>
<p>获取当前位置 → 请求天气接口 → 显示返回数据</p>
<button id="location">获取位置并更新天气</button>
<div id="status">等待操作</div>
<div class="weather" id="weather"></div>
</div>
<div class="card">
<h3>原始响应</h3>
<pre id="raw">等待接口返回...</pre>
</div>
<script>
const status=document.getElementById('status');
const weather=document.getElementById('weather');
const raw=document.getElementById('raw');

async function requestWeather(lat,lon){
 status.textContent='正在请求天气接口...';
 // 当前仅测试基础请求，不加入 accessKey 认证
 const url='https://api.weathercn.com';
 try{
   const response=await fetch(url);
   const text=await response.text();
   raw.textContent=text.slice(0,5000);
   weather.textContent='接口返回 HTTP '+response.status;
   status.textContent='请求完成';
 }catch(e){
   status.textContent='请求失败';
   raw.textContent=e.message;
 }
}

document.getElementById('location').onclick=()=>{
 if(!navigator.geolocation){
   status.textContent='浏览器不支持定位';
   return;
 }
 status.textContent='正在获取位置...';
 navigator.geolocation.getCurrentPosition(pos=>{
   const lat=pos.coords.latitude;
   const lon=pos.coords.longitude;
   status.textContent='位置：'+lat.toFixed(5)+','+lon.toFixed(5);
   requestWeather(lat,lon);
 },err=>{
   status.textContent='定位失败：'+err.message;
 });
};
</script>
</body>
</html>
